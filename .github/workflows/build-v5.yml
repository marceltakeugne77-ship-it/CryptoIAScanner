name: Build Crypto AI Scanner V5

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le repository
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Décompresser le projet V5
        run: |
          unzip -o CryptoAIScanner_V5_GitHub_Telegram.zip
          echo "Contenu du projet :"
          find CryptoAIScanner_V3 -maxdepth 3 -type f | head -50

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Compiler l'APK
        working-directory: CryptoAIScanner_V3
        run: gradle assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: CryptoAIScanner-V5-APK
          path: CryptoAIScanner_V3/app/build/outputs/apk/debug/app-debug.apk
